
<html>
<head>
<style>
:root { --surface2: #1e1e2d; --border: #333; --accent: #ff00ff; --success: #00ff00; --danger: #ff0000; --surface: #2b2b40; }
body { background: #111; color: #fff; font-family: sans-serif; }
</style>
</head>
<body>
<div style="overflow-x:auto;">
            <table style="width:100%; border-collapse:collapse; background:var(--surface2); color:#fff; font-size:0.8rem; border-radius:8px; border-style:hidden; box-shadow: 0 0 0 1px var(--border);">
                <thead>
                    <tr style="background:rgba(255,255,255,0.05); border-bottom:1px solid var(--border); text-align:left;">
                        <th style="padding:10px;">ID</th>
                        <th style="padding:10px;">CLIENTE</th>
                        <th style="padding:10px;">EVENTO</th>
                        <th style="padding:10px;">FECHA</th>
                        <th style="padding:10px;">TOTAL</th>
                        <th style="padding:10px;">ESTATUS</th>
                        <th style="padding:10px; text-align:right;">ACCIONES</th>
                    </tr>
                </thead>
                <tbody>
                <tr style="border-bottom:1px solid var(--border); cursor:pointer; transition:background 0.2s;" >
                    <td style="padding:10px; font-weight:bold; color:var(--accent);">#007</td>
                    <td style="padding:10px;">nelson carrillo</td>
                    <td style="padding:10px;">bautizo</td>
                    <td style="padding:10px;">N/A</td>
                    <td style="padding:10px; font-weight:bold; color:var(--success);">15758.40</td>
                    <td style="padding:10px;">
                        <select style="background:var(--surface); border:1px solid var(--border); color:#fff; border-radius:4px; padding:4px; font-size:0.75rem; font-weight:bold; outline:none; max-width:140px;">
                            <option value="GENERADO" >GENERADO</option>
                        </select>
                    </td>
                    <td style="padding:10px; text-align:right; white-space:nowrap;">
                        <button class="btn btn-sm" style="background:var(--danger); color:white; padding:4px 8px; border-radius:4px; font-weight:bold; font-size:0.75rem; margin-right:5px;" >🗑️</button>
                        <button class="btn btn-sm" style="background:var(--accent); color:white; padding:4px 10px; border-radius:4px; font-weight:bold; font-size:0.75rem;">✏️ EDITAR</button>
                    </td>
                </tr>
                </tbody></table></div>
</body></html>
